name: Build downloads

# Push a tag such as v0.8.3 (git tag v0.8.3 && git push origin v0.8.3) and the Mac, Windows and Linux apps are
# built, started once to check they work, and attached to a new Release. "Run workflow" on the Actions page makes test builds without a Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml          # Windows, Mac and Linux must all pass before anything is built

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-15, name: Mac-AppleSilicon}   # macos-14 is no longer offered by GitHub
          - {os: macos-15-intel, name: Mac-Intel}
          - {os: ubuntu-22.04, name: Linux}          # an older Ubuntu, so the app also runs on older Linux systems
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install the exact versions (installer/build-constraints.txt) into a clean environment
        shell: bash
        run: bash installer/pinned_env.sh -e . pyinstaller
      - run: pyinstaller --noconfirm installer/BootTool.spec
      - name: Start the app and use it once
        run: python installer/smoke_test.py dist/BootTool/BootTool
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BootTool -DestinationPath BootTool-${{ matrix.name }}.zip
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: cd dist && zip -ry ../BootTool-${{ matrix.name }}.zip BootTool
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar -czf ../BootTool-${{ matrix.name }}.tar.gz BootTool
      - uses: actions/upload-artifact@v4
        with:
          name: BootTool-${{ matrix.name }}
          path: BootTool-${{ matrix.name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.tar.gz
          generate_release_notes: true
