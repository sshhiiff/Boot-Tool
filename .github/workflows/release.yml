name: Build downloads

# Publishing a release with a new tag such as v0.9.1 (see DOWNLOAD.md) builds the Mac, Windows and Linux apps,
# numbers them from the tag, starts each once to check it works, and attaches them to the Release.
# "Run workflow" on the Actions page makes test builds without a Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/tests.yml          # Windows, Mac and Linux must all pass before anything is built

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, name: Windows}
          - {os: macos-15, name: Mac-AppleSilicon}   # macos-14 is no longer offered by GitHub
          - {os: macos-15-intel, name: Mac-Intel}
          - {os: ubuntu-22.04, name: Linux}          # an older Ubuntu, so the app also runs on older Linux systems
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Number the downloads with the release's version (tag v0.9.1 -> 0.9.1)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: bash installer/set_version.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e . pyinstaller
      - run: pyinstaller --noconfirm installer/BootTool.spec
      - name: Start the app and use it once
        run: python installer/smoke_test.py dist/BootTool/BootTool
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BootTool -DestinationPath BootTool-${{ matrix.name }}.zip
      - name: Zip (Mac)
        if: runner.os == 'macOS'
        run: cd dist && zip -ry ../BootTool-${{ matrix.name }}.zip BootTool
      - name: Pack (Linux)
        if: runner.os == 'Linux'
        run: cd dist && tar -czf ../BootTool-${{ matrix.name }}.tar.gz BootTool
      - uses: actions/upload-artifact@v4
        with:
          name: BootTool-${{ matrix.name }}
          path: BootTool-${{ matrix.name }}.*

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')   # "Run workflow" never publishes
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: Is there a release for this tag already? (made on the Releases page, with its own notes)
        id: existing
        env: {GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}"}
        run: |
          if out=$(gh api "repos/$GH_REPO/releases/tags/$GITHUB_REF_NAME" 2>&1); then echo "found=true" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" <<< "$out"; then echo "found=false" >> "$GITHUB_OUTPUT"
          else echo "$out"; exit 1; fi                       # GitHub didn't answer: stop rather than guess (re-run it)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/*.tar.gz
          generate_release_notes: ${{ steps.existing.outputs.found != 'true' }}   # notes only for a new release, so they never show twice
